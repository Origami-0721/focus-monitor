name: 自检

# 每次 push / PR 都跑一遍自检。
# 为什么值得有：这个项目没有单元测试，只有一个 `--selftest` 入口，
# 而它覆盖了状态机、阈值、时间分带这些最容易改坏的东西。没有 CI 的话，
# 只有维护者本机手动跑 —— 而"改完忘了跑"正是回归漏出去的唯一原因。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    # 必须 windows：window.py 直接调 Win32 API，模块都 import 不了。
    runs-on: windows-latest

    # 故意把控制台钉在西文代码页上。
    #
    # 这一条是踩坑换来的：CI 第一次跑就红了，两个 job 各挂一处，而根因之一是
    # 中文提示在西文代码页下会抛 UnicodeEncodeError —— 中文 Windows 的 GBK
    # 控制台打得出来，所以本机永远复现不了。runner 默认用什么代码页是没写进
    # 文档的实现细节，靠它来"顺带发现"太不牢靠：显式钉死，才每次都在测。
    env:
      PYTHONIOENCODING: cp1252

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install mediapipe opencv-python numpy pillow pystray pywebview

      # 不写死文件清单：写死的话，新加一个模块就会悄悄漏检 ——
      # 而 pyproject 声明支持 3.11，任何新模块用了 3.12 才有的语法都该在这里拦住。
      # （dashboard.py 就曾在 3.11 上编译不过：f-string 表达式里带了反斜杠，
      #   PEP 701 放宽是 3.12 的事。）
      - name: 语法检查（全部模块）
        run: python -m compileall -q -x "\.venv|__pycache__|\.git|node_modules" .

      - name: 自检
        run: python focus.py --selftest

      # 自检只覆盖纯逻辑。这一步确认所有页面都能真的渲染出来 ——
      # 模板里的 f-string 少个括号，selftest 是看不出来的，
      # 但用户点开面板第一眼就崩。
      #
      # 逻辑放在 smoke.py 里而不是内联 `python -c "..."`：内联写法会被 YAML
      # 折叠成一行且**保留行首缩进**，python -c 收到以空格开头的程序直接
      # IndentationError —— 这一步加进去之后一直是坏的，只是每次都因为前面的
      # 步骤先失败被 skip，从没暴露过。放进文件里还能本地直接跑。
      - name: 冒烟测试（各页面都能渲染）
        run: python smoke.py

      # 前两步测的是"逻辑对不对"和"页面渲不渲得出来"，都**测不出
      # "根本没人喂数据给逻辑"**。这一条补的就是那个洞。
      #
      # 起因是一次真实事故：采集循环重构时把 vision.read_face /
      # read_posture 和四个缓冲区的填充整段删了，消费端却留着 ——
      # face_buf 永远为空 → present 恒为 False → 只会产出 走神/离开，
      # 专注/中性/伏案/疲劳 四种状态一个都出不来，而自检全绿。
      # 用假摄像头 + 假 Vision 真跑一遍采集循环，几秒钟，不需要硬件。
      - name: 管线冒烟（采集循环的视觉链路是通的）
        run: python smoke_pipeline.py

      # 上面几步都在问"代码对不对"，这一步问的是"**上面那几步本身有没有用**"：
      # 把每条关键断言对应的实现改坏，自检必须变红。全绿就说明那条断言是摆设。
      #
      # 这个项目被"永远不会失败的断言"坑过不止一次，而且每次都很隐蔽：
      #   - `assert str(PYW) in _lnk` —— 写死路径的旧写法同样含 PYW，恒为真；
      #   - `assert PYW.exists()` —— 开发机有 .venv 所以恒为真，一到 CI 就红；
      #   - 「绿点为什么不见了」那次自检全绿，坏的是"根本没人喂数据给逻辑"。
      # 最典型的是用户报的"桌面快捷方式显示绿色但没在运行"：旧代码先写绿点、
      # 再起进程，任何"图标是不是绿的"的断言都测不出这个顺序问题。
      #
      # 跑 21 遍自检（基线 + 20 条变异），两三分钟 —— 比事后排查"为什么
      # 这个 bug 又回来了"便宜得多。
      - name: 变异测试（确认每条断言都真的会失败）
        run: python scripts/mutcheck.py
